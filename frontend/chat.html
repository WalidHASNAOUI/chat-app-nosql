<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-wrapper">
    <aside class="sidebar">
      <h3>En ligne</h3>
      <ul id="usersList"></ul>

      <button id="showStatsBtn">Voir stats</button>

      <!-- Stats panel, hidden by default -->
      <div id="statsPanel" class="stats-panel" style="display: none;">
        <h4>📊 Statistiques</h4>
        <div>
          <strong>Plus actif :</strong>
          <span id="mostActiveSender">–</span> (<span id="messagesSent">0</span> messages)
        </div>
        <div>
          <strong>Plus sollicité :</strong>
          <span id="mostRequestedUser">–</span> (<span id="messagesReceived">0</span> reçus)
        </div>
      </div>

      <button id="logoutBtn">Se déconnecter</button>
    </aside>
    <main class="chat-main">
      <header>
        <h2>Chat — <span id="me"></span></h2>
      </header>
      <div id="messages" class="messages">
        <div id="messagesList"></div>
          
        <div id="typingIndicator" class="typing-indicator" style="display: none;">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      </div>

      <form id="msgForm" class="msg-form">
        <div class="input-wrapper">
          <input
            type="text"
            id="msgInput"
            placeholder="Écris un message…"
            autocomplete="off"
            required
          />
          <button type="submit" aria-label="Envoyer" class="send-btn">
            <!-- Simple “paper plane” SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
            </svg>
          </button>
        </div>
      </form>
      
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
